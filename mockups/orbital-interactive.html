<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Zenu</title>
<style>
:root{
  --water:#06b6d4;--exercise:#ef4444;--eye:#3b82f6;--custom:#8b5cf6;
  --primary:#6366f1;--amber:#f59e0b;--green:#10b981;
  --surface:#1e293b;--bg:#0f172a;--text:#f1f5f9;--muted:#94a3b8;--border:#334155;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100dvh;touch-action:none}
#app{width:100%;height:100%;position:relative;overflow:hidden}

/* App bar */
.appbar{padding:calc(12px + var(--safe-top)) 20px 12px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:10}
.appbar h1{font-size:clamp(18px,5vw,22px);font-weight:700}
.appbar .actions{display:flex;gap:8px}
.appbar .abtn{padding:6px 10px;border-radius:8px;background:var(--surface);font-size:12px;color:var(--muted);cursor:pointer;border:none;display:flex;align-items:center;gap:4px;transition:.2s}
.appbar .abtn:active{transform:scale(.95)}
.status-pill{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid}

/* Orbit */
#orbit-area{position:relative;margin:0 auto;transition:all .4s cubic-bezier(.4,0,.2,1)}
.orbit-ring{position:absolute;top:50%;left:50%;border-radius:50%;border:1px dashed var(--border);transform:translate(-50%,-50%);transition:all .4s cubic-bezier(.4,0,.2,1)}
#center-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:none;color:#fff;font-family:inherit;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:2}
#center-btn:active{transform:translate(-50%,-50%) scale(.93)}
#center-btn .label{font-weight:700;letter-spacing:2px}
#center-btn .sub{font-size:10px;opacity:.7;margin-top:2px}

.orbit-item{position:absolute;top:50%;left:50%;text-align:center;cursor:pointer;transition:all .4s cubic-bezier(.4,0,.2,1);z-index:1}
.orbit-item:active{transform:translate(var(--tx),var(--ty)) scale(.9)!important}
.orbit-bubble{border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;transition:all .3s}
.orbit-label{font-size:11px;font-weight:600;margin-top:4px;white-space:nowrap}
.orbit-time{font-size:10px;font-family:'SF Mono',ui-monospace,monospace;font-weight:600}
.orbit-item.disabled{opacity:.3}
.orbit-item.selected .orbit-bubble{box-shadow:0 0 20px var(--c,#fff)}
.orbit-item.selected .orbit-label{color:var(--c)}

/* Progress ring SVG */
.progress-ring{position:absolute;top:0;left:0;transform:rotate(-90deg)}

/* Drawer */
#drawer{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.4);transition:transform .4s cubic-bezier(.4,0,.2,1);z-index:20;will-change:transform;max-height:calc(100dvh - 80px)}
#drawer.collapsed{transform:translateY(calc(100% - var(--peek-h,110px)))}
#drawer.expanded{transform:translateY(0)}
#drawer-content{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;max-height:calc(100dvh - 140px);padding-bottom:calc(20px + var(--safe-bottom))}
.drawer-handle{padding:12px 20px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;user-select:none}
.drawer-handle .grip{width:36px;height:4px;border-radius:2px;background:var(--border);margin-bottom:6px}
.drawer-handle .grip-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px}

/* Reminder rows */
.rem-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--bg);border-radius:14px;margin:0 20px 6px;transition:all .2s}
.rem-row:active{transform:scale(.98);opacity:.8}
.rem-row.disabled{opacity:.4}
.rem-row .rem-icon{font-size:16px;flex-shrink:0}
.rem-row .rem-info{flex:1;min-width:0}
.rem-row .rem-title{font-size:13px;font-weight:600}
.rem-row .rem-sub{font-size:11px;color:var(--muted)}
.rem-row .rem-time{font-size:13px;font-family:'SF Mono',ui-monospace,monospace;font-weight:600;flex-shrink:0}
.rem-row .rem-edit{width:28px;height:28px;border-radius:8px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;flex-shrink:0;border:none;color:var(--text);transition:.2s}
.rem-row .rem-edit:active{background:var(--primary)}
.rem-row.has-border{border-left:3px solid var(--c)}

/* Peek pills */
.peek-row{display:flex;gap:8px;padding:8px 20px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.peek-row::-webkit-scrollbar{display:none}
.peek-pill{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:12px;flex-shrink:0;cursor:pointer;transition:.2s}
.peek-pill:active{transform:scale(.95)}
.peek-pill.disabled{opacity:.4}
.peek-pill .pp-icon{font-size:14px}
.peek-pill .pp-name{font-size:12px;font-weight:600}
.peek-pill .pp-time{font-size:11px;font-family:monospace}

/* Edit panel */
.edit-section{padding:0 20px}
.edit-header{display:flex;align-items:center;gap:12px;padding:10px 0 14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.edit-header .eh-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.edit-header .eh-title{font-size:16px;font-weight:700;flex:1}
.toggle{width:44px;height:24px;border-radius:12px;position:relative;cursor:pointer;transition:.3s;border:none;flex-shrink:0}
.toggle.on{background:var(--green)}
.toggle.off{background:var(--border)}
.toggle::after{content:'';width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;transition:.3s}
.toggle.on::after{right:2px}
.toggle.off::after{left:2px}
.field-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px;margin-bottom:6px}
.field-group{margin-bottom:14px}
.chip-row{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:7px 0;border-radius:8px;text-align:center;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--muted);flex:1;min-width:0;transition:.2s}
.chip:active{transform:scale(.95)}
.chip.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.icon-chip{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;border:1px solid var(--border);background:var(--bg);transition:.2s;flex:0 0 36px}
.icon-chip.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.color-chip{width:36px;height:36px;border-radius:8px;cursor:pointer;border:2px solid transparent;opacity:.5;transition:.2s;flex:0 0 36px}
.color-chip.sel{border-color:#fff;opacity:1}
.text-input{width:100%;padding:10px 12px;background:var(--bg);border-radius:10px;border:1px solid var(--border);font-size:14px;color:var(--text);font-family:inherit;outline:none}
.text-input:focus{border-color:var(--primary)}
.btn-row{display:flex;gap:8px}
.btn{padding:12px;border-radius:12px;text-align:center;font-weight:700;font-size:14px;cursor:pointer;border:none;color:#fff;font-family:inherit;transition:.2s;flex:1}
.btn:active{transform:scale(.97)}
.btn-del{width:44px;flex:0 0 44px;font-size:16px;border-radius:12px;border:none;cursor:pointer;transition:.2s}
.btn-del:active{transform:scale(.95)}

/* Add reminder */
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:1px dashed var(--border);border-radius:14px;margin:6px 20px 0;cursor:pointer;color:var(--primary);transition:.2s}
.add-btn:active{background:color-mix(in srgb,var(--primary) 10%,transparent)}

/* Triggered overlay */
#triggered-overlay{position:absolute;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
#triggered-overlay.show{display:flex}
.trig-icon{border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;animation:trigPulse 1.5s infinite}
.qty-picker{display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 0}
.qty-btn{width:44px;height:44px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--text);font-family:inherit;transition:.2s}
.qty-btn:active{transform:scale(.9);background:var(--surface)}
.qty-value{font-size:clamp(28px,8vw,36px);font-weight:700;font-family:'SF Mono',monospace;min-width:90px;text-align:center}
.action-row{display:flex;gap:10px;padding:0 20px}
.action-btn{padding:16px;border-radius:14px;text-align:center;cursor:pointer;border:none;font-family:inherit;transition:.2s;color:var(--text)}
.action-btn:active{transform:scale(.96)}
.action-btn .a-icon{font-size:18px;margin-bottom:4px}

/* Bottom safe area spacer */
.safe-bottom{height:calc(10px + var(--safe-bottom))}

@keyframes trigPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(6,182,212,.3)}50%{transform:scale(1.05);box-shadow:0 0 0 15px rgba(6,182,212,0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <!-- App bar -->
  <div class="appbar">
    <h1>Zenu</h1>
    <div class="actions">
      <div class="status-pill" id="status-pill" style="display:none"></div>
      <button class="abtn" id="theme-btn" onclick="cycleTheme()">&#9790;</button>
    </div>
  </div>

  <!-- Orbit area -->
  <div id="orbit-area">
    <div class="orbit-ring" id="orbit-ring"></div>
    <button id="center-btn"></button>
    <div id="orbit-items"></div>
  </div>

  <!-- Drawer -->
  <div id="drawer" class="collapsed">
    <div class="drawer-handle" id="drawer-handle">
      <div class="grip"></div>
      <span class="grip-label" id="drawer-label">SWIPE UP FOR DETAILS</span>
    </div>
    <div id="drawer-content"></div>
  </div>

  <!-- Triggered overlay -->
  <div id="triggered-overlay">
    <div class="appbar">
      <h1>Zenu</h1>
      <div class="status-pill" style="background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green);border-color:color-mix(in srgb,var(--green) 30%,transparent)">&#9679; Running</div>
    </div>
    <div id="triggered-content" style="flex:1;overflow-y:auto"></div>
  </div>
</div>

<script>
const C={water:'#06b6d4',exercise:'#ef4444',eye:'#3b82f6',custom:'#8b5cf6',primary:'#6366f1',amber:'#f59e0b',green:'#10b981',surface:'#1e293b',bg:'#0f172a',text:'#f1f5f9',muted:'#94a3b8',border:'#334155'};

let reminders=[
  {id:0,title:'Water',icon:'\u{1F4A7}',color:C.water,interval:30,next:'12:45',qty:'250ml',enabled:true,pct:58},
  {id:1,title:'Eye Rest',icon:'\u{1F440}',color:C.eye,interval:20,next:'5:12',qty:'20 sec',enabled:true,pct:75},
  {id:2,title:'Stretch',icon:'\u{1F9D8}',color:C.green,interval:45,next:'32:10',qty:'',enabled:true,pct:29},
  {id:3,title:'Push Ups',icon:'\u{1F4AA}',color:C.exercise,interval:60,next:'48:30',qty:'15 reps',enabled:false,pct:0}
];

let isRunning=false, drawerOpen=false, editingId=null, triggeredId=null, selectedId=null;

// ===== ORBIT RENDERING =====
function renderOrbit(){
  const area=document.getElementById('orbit-area');
  const ring=document.getElementById('orbit-ring');
  const itemsEl=document.getElementById('orbit-items');
  const centerBtn=document.getElementById('center-btn');
  const statusPill=document.getElementById('status-pill');

  const small=drawerOpen||editingId!==null;
  const w=small?Math.min(220,window.innerWidth-40):Math.min(300,window.innerWidth-40);
  const h=w;
  const radius=w*0.4;
  const bubbleSize=small?42:Math.min(56,w*0.19);
  const centerSize=small?Math.min(68,w*0.31):Math.min(88,w*0.3);
  const ringSize=w*0.8;

  area.style.width=w+'px';
  area.style.height=h+'px';
  ring.style.width=ringSize+'px';
  ring.style.height=ringSize+'px';
  ring.style.borderColor=isRunning?C.green+'30':C.border;
  ring.style.borderStyle=isRunning?'solid':'dashed';

  // Center button
  centerBtn.style.width=centerSize+'px';
  centerBtn.style.height=centerSize+'px';
  if(isRunning){
    centerBtn.style.background=`linear-gradient(135deg,${C.exercise},#dc2626)`;
    centerBtn.style.boxShadow=`0 0 ${small?15:30}px ${C.exercise}20`;
    centerBtn.innerHTML=`<span class="label" style="font-size:${small?11:13}px">STOP</span>`;
  } else {
    centerBtn.style.background=`linear-gradient(135deg,${C.amber},#f97316)`;
    centerBtn.style.boxShadow=`0 0 ${small?15:30}px ${C.amber}25`;
    const active=reminders.filter(r=>r.enabled).length;
    centerBtn.innerHTML=`<span class="label" style="font-size:${small?11:13}px">START</span>${!small?`<span class="sub">${active} active</span>`:''}`;
  }

  // Status pill
  if(isRunning){
    statusPill.style.display='';
    statusPill.style.background=`color-mix(in srgb,${C.green} 15%,transparent)`;
    statusPill.style.color=C.green;
    statusPill.style.borderColor=`color-mix(in srgb,${C.green} 30%,transparent)`;
    statusPill.textContent='\u25CF Running';
  } else {
    statusPill.style.display='none';
  }

  // Orbital items
  let html='';
  reminders.forEach((r,i)=>{
    const a=i*90-90;
    const x=radius*Math.cos(a*Math.PI/180);
    const y=radius*Math.sin(a*Math.PI/180);
    const isSel=editingId===r.id;
    const cls=`orbit-item${!r.enabled&&!isSel?' disabled':''}${isSel?' selected':''}`;

    html+=`<div class="${cls}" style="--tx:calc(-50% + ${x}px);--ty:calc(-50% + ${y}px);--c:${r.color};transform:translate(calc(-50% + ${x}px),calc(-50% + ${y}px))${isSel?' scale(1.15)':''}" onclick="onBubbleTap(${r.id})">`;

    if(isRunning&&r.enabled&&!small){
      const svgS=60;const cr=27;const circ=2*Math.PI*cr;
      html+=`<div style="position:relative;width:${svgS}px;height:${svgS}px">
        <svg viewBox="0 0 ${svgS} ${svgS}" class="progress-ring" width="${svgS}" height="${svgS}">
          <circle cx="${svgS/2}" cy="${svgS/2}" r="${cr}" fill="${r.color}10" stroke="${C.border}" stroke-width="2"/>
          <circle cx="${svgS/2}" cy="${svgS/2}" r="${cr}" fill="none" stroke="${r.color}" stroke-width="2.5" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-r.pct/100)}" stroke-linecap="round"/>
        </svg>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:${svgS*0.37}px">${r.icon}</div></div>`;
    } else {
      html+=`<div class="orbit-bubble" style="width:${bubbleSize}px;height:${bubbleSize}px;background:${isSel?r.color+'25':r.color+'12'};border:2px solid ${isSel?r.color:r.enabled?r.color+'60':C.border};font-size:${bubbleSize*0.4}px">${r.icon}</div>`;
    }
    if(!small||isSel){
      html+=`<div class="orbit-label" style="color:${r.enabled?C.text:C.muted}">${r.title}</div>`;
      if(!isSel) html+=`<div class="orbit-time" style="color:${r.enabled?r.color:C.muted}">${r.enabled?r.next:'Off'}</div>`;
      else html+=`<div class="orbit-time" style="color:${r.color}">Editing</div>`;
    }
    html+=`</div>`;
  });
  itemsEl.innerHTML=html;
}

// ===== DRAWER RENDERING =====
function renderDrawer(){
  const drawer=document.getElementById('drawer');
  const label=document.getElementById('drawer-label');
  const content=document.getElementById('drawer-content');

  drawer.className=drawerOpen?'expanded':'collapsed';

  if(editingId!==null){
    drawer.className='expanded';
    const r=reminders.find(x=>x.id===editingId);
    label.textContent=`EDITING ${r.title.toUpperCase()}`;
    content.innerHTML=renderEditPanel(r);
    return;
  }

  if(!drawerOpen){
    label.textContent=isRunning?'ACTIVE TIMERS':'SWIPE UP FOR DETAILS';
    if(isRunning){
      content.innerHTML=`<div class="peek-row">${reminders.filter(r=>r.enabled).map(r=>`
        <div class="peek-pill" style="border-left:3px solid ${r.color}" onclick="openDrawer()">
          <span class="pp-icon">${r.icon}</span>
          <div><div class="pp-name">${r.title}</div>
          <div class="pp-time" style="color:${r.color}">${r.next}</div></div>
        </div>`).join('')}</div><div class="safe-bottom"></div>`;
    } else {
      content.innerHTML=`<div class="peek-row">${reminders.map(r=>`
        <div class="peek-pill${r.enabled?'':' disabled'}" onclick="openDrawer()">
          <span class="pp-icon">${r.icon}</span>
          <span class="pp-name">${r.title}</span>
          <span class="pp-time" style="color:${r.enabled?r.color:C.muted}">${r.enabled?r.next:'Off'}</span>
        </div>`).join('')}</div><div class="safe-bottom"></div>`;
    }
  } else {
    label.textContent=isRunning?'ACTIVE TIMERS':'YOUR REMINDERS';
    let html='<div style="padding:4px 0">';

    if(isRunning){
      reminders.filter(r=>r.enabled).forEach(r=>{
        html+=`<div class="rem-row has-border" style="--c:${r.color}">
          <span class="rem-icon">${r.icon}</span>
          <div class="rem-info"><div class="rem-title">${r.title}</div><div class="rem-sub">${r.interval}m${r.qty?' \u00b7 '+r.qty:''}</div></div>
          <div style="text-align:right"><div class="rem-time" style="color:${r.color};font-size:18px">${r.next}</div>
          <div style="width:80px;height:3px;border-radius:2px;background:${C.border};margin-top:4px"><div style="height:100%;border-radius:2px;background:${r.color};width:${r.pct}%"></div></div></div></div>`;
      });
      if(reminders.some(r=>!r.enabled)){
        html+=`<div style="font-size:11px;color:${C.muted};font-weight:600;letter-spacing:1px;margin:12px 20px 8px">PAUSED</div>`;
        reminders.filter(r=>!r.enabled).forEach(r=>{
          html+=`<div class="rem-row disabled"><span class="rem-icon">${r.icon}</span><div class="rem-info"><div class="rem-title">${r.title}</div></div><span style="font-size:12px;color:${C.muted}">Off</span></div>`;
        });
      }
    } else {
      reminders.forEach(r=>{
        html+=`<div class="rem-row has-border${r.enabled?'':' disabled'}" style="--c:${r.enabled?r.color:C.border}">
          <span class="rem-icon">${r.icon}</span>
          <div class="rem-info"><div class="rem-title">${r.title}</div><div class="rem-sub">${r.interval}m${r.qty?' \u00b7 '+r.qty:''}</div></div>
          <span class="rem-time" style="color:${r.enabled?r.color:C.muted}">${r.enabled?r.next:'--:--'}</span>
          <button class="rem-edit" onclick="startEdit(${r.id})">\u270E</button></div>`;
      });
      html+=`<div class="add-btn" onclick="addReminder()"><span style="font-size:18px">+</span><span style="font-size:13px;font-weight:600">Add Reminder</span></div>`;
    }
    html+=`</div><div class="safe-bottom"></div>`;
    content.innerHTML=html;
  }
}

function renderEditPanel(r){
  const intervals=[10,15,20,30,45,60,90,120];
  const icons=['\u{1F4A7}','\u{1F440}','\u{1F9D8}','\u{1F4AA}','\u{2615}','\u{1F34E}','\u{1F6B6}','\u{2728}'];
  const colors=[C.water,C.eye,C.green,C.primary,C.exercise,C.amber,C.custom,'#ec4899'];
  const qtys=r.title==='Water'?['150ml','250ml','350ml','500ml']:r.title==='Push Ups'?['10','15','20','30']:['10s','20s','30s','60s'];

  return`<div class="edit-section">
    <div class="edit-header">
      <div class="eh-icon" style="background:${r.color}20">${r.icon}</div>
      <div class="eh-title">${r.title}</div>
      <button class="toggle ${r.enabled?'on':'off'}" onclick="toggleEnabled(${r.id})"></button>
    </div>

    <div class="field-group">
      <div class="field-label">TITLE</div>
      <input class="text-input" value="${r.title}" onchange="updateTitle(${r.id},this.value)">
    </div>

    <div class="field-group">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span class="field-label" style="margin:0">EVERY</span>
        <span style="font-size:14px;font-weight:700;color:${r.color}">${r.interval} min</span>
      </div>
      <div class="chip-row" style="--c:${r.color}">
        ${intervals.map(v=>`<div class="chip${v===r.interval?' sel':''}" style="--c:${r.color}" onclick="updateInterval(${r.id},${v})">${v}</div>`).join('')}
      </div>
    </div>

    ${r.qty?`<div class="field-group">
      <div class="field-label">QUANTITY</div>
      <div class="chip-row" style="--c:${r.color}">
        ${qtys.map(q=>`<div class="chip${q===r.qty?' sel':''}" style="--c:${r.color}" onclick="updateQty(${r.id},'${q}')">${q}</div>`).join('')}
      </div>
    </div>`:''}

    <div style="display:flex;gap:10px;margin-bottom:14px">
      <div style="flex:1"><div class="field-label">ICON</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          ${icons.map(ic=>`<div class="icon-chip${ic===r.icon?' sel':''}" style="--c:${r.color}" onclick="updateIcon(${r.id},'${ic}')">${ic}</div>`).join('')}
        </div>
      </div>
      <div style="flex:1"><div class="field-label">COLOR</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          ${colors.map(c=>`<div class="color-chip${c===r.color?' sel':''}" style="background:${c}" onclick="updateColor(${r.id},'${c}')"></div>`).join('')}
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn" style="background:${r.color}" onclick="saveEdit()">Save</button>
      <button class="btn-del" style="background:${C.exercise}15;color:${C.exercise}" onclick="deleteReminder(${r.id})">\u{1F5D1}</button>
    </div>
  </div><div class="safe-bottom"></div>`;
}

// ===== TRIGGERED =====
function renderTriggered(){
  const overlay=document.getElementById('triggered-overlay');
  if(triggeredId===null){overlay.classList.remove('show');return;}
  overlay.classList.add('show');
  const r=reminders.find(x=>x.id===triggeredId);
  const content=document.getElementById('triggered-content');
  content.innerHTML=`
    <div style="text-align:center;padding:clamp(16px,5vh,30px) 20px 10px">
      <div class="trig-icon" style="width:clamp(80px,25vw,110px);height:clamp(80px,25vw,110px);background:${r.color}15;border:3px solid ${r.color};font-size:clamp(36px,10vw,52px)">${r.icon}</div>
      <div style="font-size:clamp(18px,5vw,24px);font-weight:700;margin:12px 0 4px">${r.title}!</div>
      <div style="font-size:14px;color:${C.muted}">Time for ${r.qty||'a break'}</div>
    </div>
    ${r.qty?`<div style="background:${C.surface};border-radius:16px;padding:16px;margin:0 20px 12px">
      <div style="font-size:11px;color:${C.muted};font-weight:600;margin-bottom:10px;text-align:center">HOW MUCH?</div>
      <div class="qty-picker">
        <button class="qty-btn" onclick="adjustQty(-1)">&minus;</button>
        <span class="qty-value" style="color:${r.color}" id="qty-display">${r.qty}</span>
        <button class="qty-btn" onclick="adjustQty(1)">+</button>
      </div>
    </div>`:''}
    <div class="action-row">
      <button class="action-btn" style="flex:1;background:${C.surface}" onclick="dismissTriggered()"><div class="a-icon">\u23ED</div><div style="font-size:12px;color:${C.muted}">Skip</div></button>
      <button class="action-btn" style="flex:2;background:${r.color}" onclick="completeTriggered()"><div class="a-icon">\u2705</div><div style="font-size:13px;font-weight:700">Done!</div></button>
    </div>
    <div style="padding:16px 20px 0">
      <div style="font-size:11px;color:${C.muted};font-weight:600;letter-spacing:1px;margin-bottom:8px">STILL RUNNING</div>
      ${reminders.filter(x=>x.enabled&&x.id!==triggeredId).map(x=>`
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:${C.surface};border-radius:12px;margin-bottom:4px;opacity:.7;border-left:3px solid ${x.color}">
          <span>${x.icon}</span><span style="font-size:13px;flex:1">${x.title}</span>
          <span style="font-size:12px;font-family:monospace;color:${x.color}">${x.next}</span>
        </div>`).join('')}
    </div><div class="safe-bottom"></div>`;
}

// ===== ACTIONS =====
function toggleRunning(){
  isRunning=!isRunning;
  if(editingId!==null){editingId=null;drawerOpen=false;}
  renderAll();
}
function openDrawer(){drawerOpen=true;renderAll();}
function closeDrawer(){drawerOpen=false;editingId=null;renderAll();}
function onBubbleTap(id){
  if(isRunning){
    // Tap bubble while running = trigger it (demo)
    triggeredId=id;renderTriggered();
  } else if(editingId===id){
    editingId=null;drawerOpen=false;renderAll();
  } else {
    startEdit(id);
  }
}
function startEdit(id){editingId=id;drawerOpen=true;renderAll();}
function saveEdit(){editingId=null;drawerOpen=false;renderAll();}
function toggleEnabled(id){const r=reminders.find(x=>x.id===id);r.enabled=!r.enabled;renderAll();}
function updateTitle(id,v){reminders.find(x=>x.id===id).title=v;}
function updateInterval(id,v){reminders.find(x=>x.id===id).interval=v;renderAll();}
function updateQty(id,v){reminders.find(x=>x.id===id).qty=v;renderAll();}
function updateIcon(id,v){reminders.find(x=>x.id===id).icon=v;renderAll();}
function updateColor(id,v){reminders.find(x=>x.id===id).color=v;renderAll();}
function deleteReminder(id){reminders=reminders.filter(x=>x.id!==id);editingId=null;drawerOpen=reminders.length>0;renderAll();}
function addReminder(){
  const id=Math.max(...reminders.map(r=>r.id))+1;
  reminders.push({id,title:'New',icon:'\u2728',color:C.custom,interval:30,next:'30:00',qty:'',enabled:true,pct:0});
  startEdit(id);
}
function dismissTriggered(){triggeredId=null;renderTriggered();}
function completeTriggered(){triggeredId=null;renderTriggered();}
function adjustQty(dir){/* demo placeholder */}
function cycleTheme(){/* demo placeholder */}

function renderAll(){renderOrbit();renderDrawer();renderTriggered();}

// ===== CENTER BTN =====
document.getElementById('center-btn').addEventListener('click',toggleRunning);

// ===== DRAWER GESTURES =====
let dragStartY=0,dragging=false;
const handle=document.getElementById('drawer-handle');
handle.addEventListener('pointerdown',e=>{dragStartY=e.clientY;dragging=true;handle.setPointerCapture(e.pointerId);});
handle.addEventListener('pointermove',e=>{if(!dragging)return;});
handle.addEventListener('pointerup',e=>{
  if(!dragging)return;dragging=false;
  const dy=e.clientY-dragStartY;
  if(editingId!==null){if(dy>40){editingId=null;drawerOpen=false;renderAll();}return;}
  if(dy<-30&&!drawerOpen){openDrawer();}
  else if(dy>30&&drawerOpen){closeDrawer();}
  else if(Math.abs(dy)<5){drawerOpen?closeDrawer():openDrawer();}
});
// Also allow tap on handle
handle.addEventListener('click',e=>{
  if(editingId!==null){editingId=null;drawerOpen=false;renderAll();return;}
  drawerOpen?closeDrawer():openDrawer();
});

// ===== RESIZE =====
window.addEventListener('resize',renderAll);

// ===== INIT =====
renderAll();

// ===== LIVE TIMER (demo) =====
setInterval(()=>{
  if(!isRunning)return;
  reminders.forEach(r=>{
    if(!r.enabled)return;
    r.pct=Math.min(100,r.pct+0.3);
    if(r.pct>=100){r.pct=0;}
    // Fake countdown
    let[m,s]=r.next.split(':').map(Number);
    s--;if(s<0){s=59;m--;}if(m<0){m=r.interval;s=0;if(triggeredId===null){triggeredId=r.id;renderTriggered();}}
    r.next=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  });
  renderOrbit();
  if(drawerOpen)renderDrawer();
},1000);
</script>
